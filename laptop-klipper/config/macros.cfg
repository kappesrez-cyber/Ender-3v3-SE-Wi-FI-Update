# Макросы для печати из Orca Slicer.
# PAUSE / RESUME / CANCEL_PRINT и [virtual_sdcard] берутся из mainsail.cfg
# (KIAUH кладёт его рядом при установке Mainsail).
#
# Стартовый G-code в Orca:
#   START_PRINT BED_TEMP=[bed_temperature_initial_layer_single] EXTRUDER_TEMP=[nozzle_temperature_initial_layer]
# Конечный G-code в Orca:
#   END_PRINT

[gcode_macro START_PRINT]
description: Нагрев, парковка, сетка стола, линия прочистки
gcode:
    {% set BED = params.BED_TEMP|default(60)|float %}
    {% set EXT = params.EXTRUDER_TEMP|default(200)|float %}
    {% set MESH = params.MESH|default(1)|int %}
    M117 Нагрев...
    M140 S{BED}
    M104 S150                      ; сопло до 150 — не течёт при замере
    G90
    M83
    G28
    M190 S{BED}
    {% if MESH == 0 and 'default' in printer.bed_mesh.profiles %}
      BED_MESH_PROFILE LOAD=default  ; MESH=0 — взять сохранённую сетку
    {% else %}
      BED_MESH_CALIBRATE ADAPTIVE=1  ; сетка только под область печати
    {% endif %}
    G1 X2 Y20 Z5 F6000
    M109 S{EXT}
    ; линия прочистки у левого края
    G1 Z0.3 F600
    G1 X2 Y200 E15 F1500
    G1 X2.4 Y200 F3000
    G1 X2.4 Y20 E15 F1500
    G1 Z2 F600
    G92 E0
    M117 Печать

[gcode_macro END_PRINT]
description: Отвод, парковка, выключение нагрева
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set z = [printer.toolhead.position.z + 10, max_z]|min %}
    M400
    G91
    G1 E-2 F2700
    G1 Z2 F600
    G90
    G1 Z{z} F600
    G1 X5 Y220 F6000
    TURN_OFF_HEATERS
    M106 S0
    M84 X Y E
    M117 Готово

[gcode_macro LOAD_FILAMENT]
description: Нагреть и протолкнуть пруток
gcode:
    {% set T = params.TEMP|default(210)|float %}
    M109 S{T}
    M83
    G1 E50 F300
    G1 E25 F150
    M400

[gcode_macro UNLOAD_FILAMENT]
description: Нагреть и вытянуть пруток
gcode:
    {% set T = params.TEMP|default(210)|float %}
    M109 S{T}
    M83
    G1 E10 F300
    G1 E-60 F1800
    M400

[gcode_macro CALIBRATE_Z_OFFSET]
description: Авто Z-offset тензодатчиком (prtouch)
gcode:
    G28
    PRTOUCH_PROBE_ZOFFSET

[gcode_macro CALIBRATE_BED_MESH]
description: Полная сетка стола и сохранение
gcode:
    G28
    BED_MESH_CALIBRATE
    SAVE_CONFIG
