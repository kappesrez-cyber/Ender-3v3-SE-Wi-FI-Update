# =====================================================================
#  Creality Ender 3 V3 SE — Klipper на хосте-ноутбуке, с родным экраном
# ---------------------------------------------------------------------
#  Основа: 0xD34D/ender3-v3-se-klipper-config
#          (printer-creality-ender3-v3-se-2023.cfg, prtouch.cfg)
#  Klipper: jpcurti/ender3-v3-se-klipper-with-display (ветка master)
#
#  Прошивка платы: scripts/03-build-firmware.sh
#    STM32F103 (для C13 с GD32F303 тоже), загрузчик 28KiB,
#    USB-serial на USART1 PA10/PA9, 115200, мост экрана на USART2.
#
#  Пины ниже проверены сообществом на плате C13 (GD32F303).
#  Для C14 первый запуск делай ОСТОРОЖНО: см. docs/02-firmware-c13-c14.md
#  (проверка концевиков, направлений осей и нагревателей по шагам).
# =====================================================================

[include mainsail.cfg]
[include macros.cfg]
[include prtouch.cfg]
[include display.cfg]

[mcu]
# Путь подставляет scripts/04-install-config.sh. Для нескольких принтеров
# ОБЯЗАТЕЛЬНО by-path: by-id у всех V3 SE одинаковый (CH340).
serial: __SERIAL__
baud: 115200
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 2500
max_z_velocity: 5
square_corner_velocity: 5.0
max_z_accel: 100

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ~!PA5
position_endstop: -6
position_min: -6
position_max: 230
homing_speed: 80

[tmc2208 stepper_x]
uart_pin: PB12
run_current: 0.60
sense_resistor: 0.150
interpolate: True

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ~!PA6
position_endstop: -14
position_min: -14
position_max: 230
homing_speed: 80

[tmc2208 stepper_y]
uart_pin: PB13
run_current: 0.60
sense_resistor: 0.150
interpolate: True

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.0

[tmc2208 stepper_z]
uart_pin: PB14
run_current: 0.8
sense_resistor: 0.150
interpolate: True

[extruder]
max_extrude_only_distance: 100.0
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.44
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
# сток, цель 200 °C. Перекалибруй: PID_CALIBRATE HEATER=extruder TARGET=210
pid_Kp: 27.142
pid_Ki: 1.371
pid_Kd: 134.351
min_temp: 0
max_temp: 260
pressure_advance: 0.0   # подбери позже (TUNING_TOWER), для стока ~0.04–0.08

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
# сток, цель 70 °C. Перекалибруй: PID_CALIBRATE HEATER=heater_bed TARGET=60
pid_kp: 66.371
pid_ki: 0.846
pid_kd: 1301.702
min_temp: 0
max_temp: 100

# Защита от перегрева/обрыва термистора: в Klipper verify_heater включён
# по умолчанию для всех нагревателей. НЕ отключай его.

[heater_fan hotend_fan]
pin: PC1

[fan]
pin: PA0

[bltouch]
# CR Touch
sensor_pin: ^PC14
control_pin: PC13
x_offset: -23.0
y_offset: -14.5
z_offset: 2.65        # подстрой: PROBE_CALIBRATE или PRTOUCH_PROBE_ZOFFSET
speed: 20
pin_move_time: 0.4
stow_on_each_sample: False
probe_with_touch_mode: True

[safe_z_home]
home_xy_position: 134,123
speed: 150
z_hop: 10
z_hop_speed: 10

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30,30
mesh_max: 207,215.5
probe_count: 5,5
algorithm: bicubic

[screws_tilt_adjust]
screw1: 54.5, 45.5
screw1_name: передний левый
screw2: 224.5, 45.5
screw2_name: передний правый
screw3: 224.5, 215.5
screw3_name: задний правый
screw4: 54.5, 215.5
screw4_name: задний левый
horizontal_move_z: 10.
speed: 50.
screw_thread: CCW-M4

[output_pin beeper]
pin: PB0

# Отмена отдельных объектов из Mainsail (в Orca включи "Label objects")
[exclude_object]

# Дуги G2/G3 (если в Orca включить "Arc fitting")
[gcode_arcs]
resolution: 1.0

[idle_timeout]
timeout: 1800
