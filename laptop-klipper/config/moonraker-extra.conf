# Дополнение к moonraker.conf, который создаёт KIAUH.
# KIAUH уже прописывает [server] (порт 7125, 7126, ...), [authorization]
# с домашними подсетями, [history], [update_manager] — их не трогаем.
# scripts/04-install-config.sh добавляет секцию ниже, только если её ещё нет.

[file_manager]
# Moonraker размечает объекты в загруженном G-code -> отмена отдельной детали
# в Mainsail ([exclude_object] в printer.cfg) и адаптивная сетка стола.
enable_object_processing: True
