# Родной экран Ender 3 V3 SE через Klipper (jpcurti).
# Требуется прошивка САМОГО ЭКРАНА 1.0.6 — на других версиях картинки "поедут".
# Плата должна быть прошита с мостом USART2 (scripts/03-build-firmware.sh).

[e3v3se_display]
language: english     # русского нет; варианты в репозитории jpcurti
logging: False

# Пункты меню "Misc" на экране (макросы из macros.cfg / prtouch.cfg).
# Номера иконок можно посмотреть командой ENDER_SE_DISPLAY_ICON_FINDER.
[e3v3se_display MACRO1]
gcode: LOAD_FILAMENT
label: Load filament
icon: 14

[e3v3se_display MACRO2]
gcode: UNLOAD_FILAMENT
label: Unload filament
icon: 14

[e3v3se_display MACRO3]
gcode: CALIBRATE_Z_OFFSET
label: Auto Z offset
icon: 12

[e3v3se_display MACRO4]
gcode: CALIBRATE_BED_MESH
label: Bed mesh
icon: 29

[e3v3se_display MACRO5]
gcode: NOZZLE_CLEAR
label: Clean nozzle
icon: 9
