<style>
/* 309_base: чёрное поле, стеклянные (Liquid glass) карточки, Murs Gothic для заголовков и цифр. Без градиентов. */
:root {
  color-scheme: dark;
  --bg: #050505;
  --glass: rgba(255,255,255,.055);
  --glass-2: rgba(255,255,255,.09);
  --glass-hi: rgba(255,255,255,.14);
  --line: rgba(255,255,255,.11);
  --line-2: rgba(255,255,255,.2);
  --ink: #F4F4F2;
  --muted: #8E8E8A;
  --dim: #5A5A57;
  --ok: #6FCF97;
  --warn: #E8C26A;
  --err: #F07171;
  --display: "Murs Gothic", "Arial Black", system-ui, sans-serif;
  --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 22px; --r-s: 14px;
  --blur: saturate(140%) blur(22px);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--text); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
/* мягкие светлые пятна, чтобы стеклу было что преломлять */
.field { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.field i { position: absolute; border-radius: 50%; filter: blur(90px); background: #fff; }
.field i:nth-child(1) { width: 46vmax; height: 46vmax; top: -18vmax; right: -12vmax; opacity: .07; }
.field i:nth-child(2) { width: 34vmax; height: 34vmax; bottom: -16vmax; left: -10vmax; opacity: .05; }
.glass, .card, dialog { background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 20px 40px -24px rgba(0,0,0,.8); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

header.top { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; padding: 24px 28px 18px; }
.logo { display: flex; align-items: center; gap: 12px; }
.mark { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line-2); display: grid; place-items: center; background: var(--glass-2); }
h1 { margin: 0; font: 400 clamp(22px, 3.2vw, 32px)/1.1 var(--display); letter-spacing: .01em; }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); font: 11px var(--display); letter-spacing: .04em; color: var(--muted); }
.chip b { color: var(--ink); font-weight: 400; }
#clock { font: 12px var(--mono); color: var(--muted); }

main { position: relative; z-index: 1; padding: 0 28px 60px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.card { border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; transition: border-color .15s; }
.card:hover { border-color: var(--line-2); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1 1 140px; min-width: 0; }
.name { font: 400 17px var(--display); }
.host { font: 11.5px var(--mono); color: var(--muted); }
.muted { color: var(--muted); font-size: 12px; }

.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); font: 10.5px var(--display); letter-spacing: .05em; white-space: nowrap; text-transform: uppercase; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.pill.s-idle i { background: var(--ok); }
.pill.s-printing i { background: var(--ink); box-shadow: 0 0 0 3px rgba(255,255,255,.15); animation: pulse 2s infinite; }
.pill.s-paused i, .pill.s-upload i { background: var(--warn); }
.pill.s-upload i { animation: pulse 1.2s infinite; }
.pill.s-offline { color: var(--muted); }
.pill.s-offline i { background: var(--err); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.card.off { opacity: .72; }

.temps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.temp { padding: 10px 12px; border-radius: var(--r-s); background: rgba(255,255,255,.035); border: 1px solid var(--line); min-width: 0; }
.temp small { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.temp b { font: 400 22px var(--display); font-variant-numeric: tabular-nums; }
.temp em { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 4px; }
.job { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pct { font: 13px var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.progress { height: 6px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 8px; }
.progress > div { height: 100%; width: 0; background: var(--ink); border-radius: inherit; transition: width .6s; }
.card.paused .progress > div { background: var(--warn); }

button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); font: 11px var(--display); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; transition: background .15s, border-color .15s; }
button:hover { background: var(--glass-hi); border-color: var(--line-2); }
button.primary { background: var(--ink); color: #000; border-color: var(--ink); }
button.primary:hover { background: #fff; }
button.danger { color: var(--err); border-color: rgba(240,113,113,.35); }
button.danger:hover { background: rgba(240,113,113,.12); }
button:disabled { opacity: .35; pointer-events: none; }
input, select { height: 38px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.35); padding: 0 12px; min-width: 0; }
select { background: #111; }
input[type=file] { padding: 7px 10px; font-size: 12px; color: var(--muted); }
input[type=file]::file-selector-button { font: 10.5px var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); background: var(--glass-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; margin-right: 10px; cursor: pointer; }
.upstate { font-size: 12px; color: var(--muted); min-height: 0; }
.upstate:empty { display: none; }
details summary { cursor: pointer; color: var(--muted); font: 11px var(--display); letter-spacing: .05em; text-transform: uppercase; }
.cmd { font-family: var(--mono); font-size: 13px; border-radius: 999px; padding: 0 16px; }
pre { margin: 8px 0 0; max-height: 160px; overflow: auto; background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px; font: 12px/1.6 var(--mono); color: var(--muted); white-space: pre-wrap; word-break: break-all; }
pre:empty { display: none; }
a.web { color: var(--muted); font-size: 12px; text-decoration: none; border-bottom: 1px solid var(--line-2); }
a.web:hover { color: var(--ink); }

dialog { border-radius: 26px; padding: 24px; color: var(--ink); width: min(440px, calc(100vw - 32px)); background: rgba(22,22,22,.72); }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog form { display: grid; gap: 16px; }
dialog h3 { margin: 0; font: 400 18px var(--display); }
dialog label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
dialog input { height: 44px; border-radius: 14px; font-size: 14px; color: var(--ink); width: 100%; }
.addcard { border-radius: var(--r); border: 1px dashed var(--line-2); background: none; min-height: 220px; display: grid; place-items: center; color: var(--muted); font: 12px var(--display); letter-spacing: .04em; text-transform: uppercase; }
.addcard:hover { color: var(--ink); background: var(--glass); }
.addcard span { display: grid; justify-items: center; gap: 10px; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 24px 0 0; }

@media (max-width: 700px) {
  header.top { padding: 16px 16px 12px; }
  main { padding: 0 16px 40px; grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>

<script>
"use strict";
// Список принтеров хранится в браузере. Ключ — localStorage, с запасным вариантом в памяти.
const KEY = "e3v3se-panel-printers";
let memStore = null;
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return memStore || []; }
}
function save(list) {
  memStore = list;
  try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
}

const POLL_MS = 5000;
const printers = new Map(); // id -> state

// Запросы к одному модулю выполняются строго по очереди: ESP3D 2.1 однопоточный.
function enqueue(p, fn) {
  const run = p.queue.then(fn, fn);
  p.queue = run.catch(() => {});
  return run;
}

function baseUrl(host) {
  host = host.trim().replace(/\/+$/, "");
  return /^https?:\/\//.test(host) ? host : "http://" + host;
}

async function command(p, gcode, timeoutMs = 6000) {
  return enqueue(p, async () => {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeoutMs);
    try {
      const r = await fetch(baseUrl(p.host) + "/command?plain=" + encodeURIComponent(gcode), { signal: ctl.signal, cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.text();
    } finally { clearTimeout(t); }
  });
}

function log(p, line) {
  const pre = p.el.querySelector(".log");
  pre.textContent = (line + "\n" + pre.textContent).slice(0, 4000);
}

function parseTemps(txt) {
  const m = {};
  const hot = /T:\s*([\d.]+)\s*\/\s*([\d.]+)/.exec(txt);
  const bed = /B:\s*([\d.]+)\s*\/\s*([\d.]+)/.exec(txt);
  if (hot) { m.hot = +hot[1]; m.hotSet = +hot[2]; }
  if (bed) { m.bed = +bed[1]; m.bedSet = +bed[2]; }
  return m;
}

function parseProgress(txt) {
  const m = /SD printing byte\s+(\d+)\s*\/\s*(\d+)/.exec(txt);
  if (m && +m[2] > 0) return { printing: true, pct: Math.min(100, (100 * +m[1]) / +m[2]) };
  return { printing: false };
}

const STATE = { on: "s-idle", busy: "s-printing", paused: "s-paused", upload: "s-upload", off: "s-offline" };
function setState(p, cls, text) {
  const b = p.el.querySelector(".state");
  b.className = "pill state " + (STATE[cls] || "");
  b.querySelector(".label").textContent = text;
  p.state = cls;
  p.el.classList.toggle("off", cls === "off");
  p.el.classList.toggle("paused", cls === "paused");
  summary();
}

function summary() {
  const all = [...printers.values()];
  document.getElementById("cTotal").textContent = all.length;
  document.getElementById("cOnline").textContent = all.filter((x) => x.state && x.state !== "off").length;
  document.getElementById("cPrinting").textContent = all.filter((x) => x.state === "busy").length;
}

async function poll(p) {
  if (p.uploading) return;
  try {
    const t = parseTemps(await command(p, "M105"));
    const pr = parseProgress(await command(p, "M27"));
    p.online = true;
    const q = (s) => p.el.querySelector(s);
    q(".t-hot").textContent = t.hot != null ? t.hot.toFixed(0) + "°" : "—";
    q(".t-hot-set").textContent = t.hotSet ? "/ " + t.hotSet.toFixed(0) + "°" : "";
    q(".t-bed").textContent = t.bed != null ? t.bed.toFixed(0) + "°" : "—";
    q(".t-bed-set").textContent = t.bedSet ? "/ " + t.bedSet.toFixed(0) + "°" : "";
    q(".progress > div").style.width = pr.printing ? pr.pct.toFixed(1) + "%" : "0";
    q(".pct").textContent = pr.printing ? pr.pct.toFixed(1) + " %" : "";
    if (pr.printing) p.paused = false;
    const paused = !pr.printing && p.paused;
    q(".job").textContent = pr.printing ? "Печатает" + (p.lastFile ? ": " + p.lastFile : "")
      : paused ? "Пауза" + (p.lastFile ? ": " + p.lastFile : "") : "Нет печати";
    setState(p, pr.printing ? "busy" : paused ? "paused" : "on", pr.printing ? "печать" : paused ? "пауза" : "на связи");
  } catch (e) {
    p.online = false;
    setState(p, "off", "нет связи");
  }
}

async function refreshFiles(p) {
  const txt = await command(p, "M20", 10000);
  const sel = p.el.querySelector(".files");
  const files = [];
  let inList = false;
  for (const raw of txt.split("\n")) {
    const line = raw.trim();
    if (line.startsWith("Begin file list")) { inList = true; continue; }
    if (line.startsWith("End file list")) break;
    if (inList && line) {
      // Формат Marlin: "SHORT.GCO 12345" или с длинным именем после размера (LONG_FILENAME_HOST_SUPPORT)
      const parts = line.split(" ");
      const short = parts[0];
      const long = parts.slice(2).join(" ");
      if (/\.(gco|gcode|g)$/i.test(short)) files.push({ short, label: long || short });
    }
  }
  sel.innerHTML = '<option value="">' + (files.length ? "Выберите файл" : "На SD нет G-code") + "</option>";
  for (const f of files) {
    const o = document.createElement("option");
    o.value = f.short; o.textContent = f.label;
    sel.appendChild(o);
  }
}

// Имя в формате 8.3, как это делает Orca Slicer для ESP3D.
function shortName(name) {
  const dot = name.lastIndexOf(".");
  let base = (dot > 0 ? name.slice(0, dot) : name).replace(/[^A-Za-z0-9_-]/g, "").toUpperCase() || "PRINT";
  return base.slice(0, 8) + ".GCO";
}

// Без отслеживания прогресса: подписка на xhr.upload делает запрос «непростым» по CORS,
// браузер шлёт предварительный OPTIONS, а ESP3D его не обрабатывает. Узкое место всё равно
// не Wi-Fi, а UART между ESP и принтером, поэтому показываем просто прошедшее время.
async function upload(p, file) {
  return enqueue(p, async () => {
    const name = shortName(file.name);
    const fd = new FormData();
    fd.append("file", file, name);
    const st = p.el.querySelector(".upstate");
    const t0 = Date.now();
    const kb = Math.max(1, Math.round(file.size / 1024));
    const tick = setInterval(() => {
      st.textContent = "Загрузка " + name + " (" + kb + " КБ) на SD принтера: " + Math.round((Date.now() - t0) / 1000) + " с";
    }, 1000);
    try {
      const r = await fetch(baseUrl(p.host) + "/upload_serial", { method: "POST", body: fd });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return name;
    } finally { clearInterval(tick); }
  });
}

async function startPrint(p, name) {
  await command(p, "M23 " + name);
  await command(p, "M24");
  p.lastFile = name;
  p.paused = false;
  log(p, "> M23 " + name + " / M24");
}

async function act(p, what) {
  const q = (s) => p.el.querySelector(s);
  try {
    // Marlin на M27 во время паузы отвечает «Not SD printing», поэтому паузу помним сами
    if (what === "pause") { log(p, await command(p, "M25")); p.paused = true; }
    if (what === "resume") { log(p, await command(p, "M24")); p.paused = false; }
    if (what === "stop" && confirmStop(p)) { log(p, await command(p, "M524")); p.paused = false; }
    if (what === "refresh") await refreshFiles(p);
    if (what === "print") {
      const f = q(".files").value;
      if (f) await startPrint(p, f);
    }
    if (what === "send") {
      const c = q(".cmd").value.trim();
      if (c) { log(p, "> " + c + "\n" + (await command(p, c, 15000))); q(".cmd").value = ""; }
    }
    if (what === "upload") {
      const file = q(".upfile").files[0];
      if (!file) return;
      p.uploading = true;
      setState(p, "upload", "загрузка");
      try {
        const name = await upload(p, file);
        q(".upstate").textContent = "Загружено: " + name + ". Запускаю печать…";
        await new Promise((r) => setTimeout(r, 2000)); // Marlin нужно время после M29
        await startPrint(p, name);
        q(".upstate").textContent = "Печать запущена: " + name;
      } finally { p.uploading = false; }
    }
    if (what === "remove") {
      save(load().filter((x) => x.id !== p.id));
      clearInterval(p.timer);
      p.el.remove();
      printers.delete(p.id);
      renderEmpty();
      summary();
    }
  } catch (e) {
    log(p, "Ошибка: " + e.message);
    q(".upstate").textContent = what === "upload" ? "Ошибка загрузки: " + e.message : q(".upstate").textContent;
  }
  poll(p);
}

// Стоп без системного диалога confirm(): второе нажатие в течение 3 с подтверждает.
function confirmStop(p) {
  const b = p.el.querySelector('[data-act="stop"]');
  if (p.stopArmed) { p.stopArmed = false; b.textContent = "Стоп"; return true; }
  p.stopArmed = true;
  b.textContent = "Точно стоп?";
  setTimeout(() => { p.stopArmed = false; b.textContent = "Стоп"; }, 3000);
  return false;
}

function mount(cfg) {
  const el = document.getElementById("tpl").content.firstElementChild.cloneNode(true);
  const p = { ...cfg, el, queue: Promise.resolve(), uploading: false };
  el.querySelector(".name").textContent = cfg.name;
  el.querySelector(".host").textContent = cfg.host;
  el.querySelector(".web").href = baseUrl(cfg.host);
  el.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]");
    if (b) act(p, b.dataset.act);
  });
  el.querySelector(".cmd").addEventListener("keydown", (e) => { if (e.key === "Enter") act(p, "send"); });
  document.getElementById("grid").appendChild(el);
  printers.set(cfg.id, p);
  summary();
  poll(p);
  p.timer = setInterval(() => poll(p), POLL_MS);
}

function renderEmpty() {
  const grid = document.getElementById("grid");
  const empty = grid.querySelector(".empty");
  if (printers.size === 0 && !empty) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "Принтеров пока нет. Нажмите «Добавить принтер» и укажите IP модуля ESP3D.";
    grid.appendChild(d);
  } else if (printers.size > 0 && empty) empty.remove();
}

document.getElementById("add").onclick = () => document.getElementById("dlg").showModal();
document.getElementById("dlg").addEventListener("close", () => {
  const dlg = document.getElementById("dlg");
  const f = document.getElementById("dlgForm");
  if (dlg.returnValue === "ok") {
    const cfg = { id: Date.now().toString(36), name: f.name.value.trim(), host: f.host.value.trim() };
    save([...load(), cfg]);
    mount(cfg);
    renderEmpty();
  }
  f.reset();
});

setInterval(() => { document.getElementById("clock").textContent = new Date().toLocaleTimeString(); }, 1000);
load().forEach(mount);
renderEmpty();
</script>
</body>
</html>
